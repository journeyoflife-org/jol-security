name: Enforce Commit Signing
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-signatures:
    name: Verify Commit Signatures
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify PR commits are signed (GitHub's own cryptographic check)
        if: github.event_name == 'pull_request'
        run: |
          BAD=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/commits?per_page=100" \
            --paginate \
            --jq '.[] | select(.commit.verification.verified != true) | "  \(.sha[0:8]) reason=\(.commit.verification.reason // "n/a") committer=\(.commit.committer.name)"')
          if [ -n "${BAD}" ]; then
            echo "::error::These PR commits are not cryptographically verified by GitHub:"
            printf '%s\n' "${BAD}"
            echo 'Sign with: git commit -S  (key registered to the author account).'
            exit 1
          fi
          echo 'PASS: every PR commit is verified by GitHub.'

      - name: Verify push commits are signed (GitHub's own cryptographic check)
        if: github.event_name == 'push'
        run: |
          FAIL=0
          SHAS=$(printf '%s\n' '${{ toJSON(github.event.commits[*].id) }}' | grep -Eo '[0-9a-f]{40}')
          SHAS="${SHAS}
          ${{ github.sha }}"
          for sha in $(printf '%s\n' "${SHAS}" | grep -Eo '[0-9a-f]{40}' | sort -u); do
            VERIFIED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.commit.verification.verified')
            if [ "${VERIFIED}" != "true" ]; then
              REASON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.commit.verification.reason // "n/a"')
              echo "::error::Unverified push commit ${sha:0:8} (reason=${REASON})"
              FAIL=1
            fi
          done
          if [ "${FAIL}" = "0" ]; then echo 'PASS: every push commit is verified by GitHub.'; fi
          exit "${FAIL}"
