name: Code Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Validate structure
        run: ./scripts/validate-local-repo.sh

  policy-lint:
    name: Policy Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run policy lint
        run: ./scripts/policy-lint.sh

  evidence-check:
    name: Evidence Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run evidence manifest check
        run: ./scripts/evidence-manifest.sh

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Lint markdown files
uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8  # v16
        with:
          globs: '**/*.md'

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint -d relaxed .
